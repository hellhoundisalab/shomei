name: Prepare exhibition PR
run-name: exhibition-pr-${{ fromJSON(inputs.publication).job_id }}
on:
  workflow_dispatch:
    inputs:
      publication:
        description: Approved public manifest and preview hashes (from review)
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: prepare-exhibition
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install --index-url https://pypi.org/simple -r requirements-ci.txt
      - run: python -m unittest discover -s tests
      - run: python scripts/publication_job.py prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication-changes
          path: publication/changes.json
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: approved-preview
          path: preview/
          retention-days: 7
          if-no-files-found: error
  create-pr:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install --index-url https://pypi.org/simple -r requirements-ci.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: publication-changes
          path: publication
      - run: python scripts/publication_job.py create
        env:
          GH_TOKEN: ${{ github.token }}

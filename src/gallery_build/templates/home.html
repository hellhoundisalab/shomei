<div class="home">
  <nav class="home-links" aria-label="Участие в галерее">
    <a href="https://t.me/pgaltestbot" target="_blank" rel="noopener" aria-label="Открыть Telegram-бота" title="Открыть Telegram-бота" data-tooltip="Telegram-бот"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 18-7-4 16-6-5-4 3 1-6 10-6-7 9M3 11l5 1"/></svg></a>
    <a href="https://shomei.ru/new/" aria-label="Создать заявку в форме" title="Создать заявку в форме" data-tooltip="Создать заявку"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 4H5v16h14v-8M11 13l1-4 7-7 3 3-7 7-4 1Z"/></svg></a>
  </nav>
  <div class="film-background" aria-hidden="true">
    <img class="film-photograph" src="{{ prefix }}assets/film-background.webp" alt="" fetchpriority="high">
    <div class="film-veil"></div>
  </div>
  <nav class="modes" aria-label="Режим галереи">
    <button type="button" data-mode="collective" aria-pressed="false">ВЫСТАВКИ</button>
    <button type="button" data-mode="author" aria-pressed="true">АВТОРЫ</button>
  </nav>
  <div class="rail" aria-label="Коллекции">
  {% for item in items %}
    <a class="tablet{% if loop.first %} is-active{% endif %}" href="{{ prefix }}exhibitions/{{ item.id }}/index.html" data-view-link="{{ item.id }}" data-kind="{{ item.kind }}" style="--surface:{{ item.theme.background }};--accent:{{ item.theme.accent }};--ink:{{ item.theme.accent }};--body-font:{{ item.theme|font_stack }}" {% if item.kind != 'author' %}hidden{% endif %}>
      <div class="metadata"><h2>{{ item.title }}</h2>
        {% if item.kind == 'author' %}<p>{{ item.author }}</p>{% else %}<p><em>{{ item.description }}</em></p>{% endif %}
        <time datetime="{{ item.date }}">{{ item.date|display_date }}</time>
      </div>
      <div class="stack" aria-hidden="true">{% for photo in item.photos[:3] %}<img draggable="false" style="{{ scatter(item.id, loop.index0) }}" src="{{ (prefix if photo.preview.startswith("media/") else "") ~ photo.preview }}" alt="" loading="lazy">{% endfor %}</div>
    </a>
  {% endfor %}
  </div>
</div>

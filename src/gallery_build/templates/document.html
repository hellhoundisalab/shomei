<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light"><title>{{ view.title }}</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="{{ prefix }}assets/gallery.css">
<link id="custom-style" rel="stylesheet" href="{{ prefix }}assets/{% if key == 'home' %}empty{% else %}custom-{{ key }}{% endif %}.css">
<script src="{{ prefix }}assets/views.js" defer></script><script src="{{ prefix }}assets/gallery.js" defer></script>
<script src="{{ prefix }}assets/interactions.js" defer></script>
</head><body data-view="{{ key }}" style="background-color:{{ view.background }}">
<main id="gallery" tabindex="-1">{{ content|safe }}</main>
<dialog id="photo-viewer" aria-label="Просмотр фотографии">
  <div class="viewer-toolbar"><button type="button" data-viewer="out" aria-label="Уменьшить">−</button><button type="button" data-viewer="reset" aria-label="Вписать в экран"><output id="viewer-zoom">100%</output></button><button type="button" data-viewer="in" aria-label="Увеличить">+</button><button type="button" data-viewer="close" aria-label="Закрыть фотографию" autofocus>×</button></div>
  <div class="viewer-stage"><img id="viewer-image" alt="" draggable="false"></div>
</dialog>
</body></html>
